name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

# A new push supersedes an in-flight run on the same ref.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.12"
  NODE_VERSION: "22"
  POETRY_VERSION: "2.3.3"

jobs:
  backend:
    name: Backend (lint, tests, migrations on Postgres)
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: iap
          POSTGRES_PASSWORD: iap_ci
          POSTGRES_DB: iap
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U iap -d iap"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20

    env:
      # Postgres, not the SQLite fallback: CI must exercise the dialect that is deployed.
      IAP_DATABASE_URL: postgresql+psycopg://iap:iap_ci@127.0.0.1:5432/iap

    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install Poetry
        run: pipx install "poetry==${{ env.POETRY_VERSION }}"

      - name: Cache the virtualenv
        uses: actions/cache@v4
        with:
          path: backend/.venv
          key: venv-${{ runner.os }}-py${{ env.PYTHON_VERSION }}-${{ hashFiles('backend/poetry.lock') }}

      - name: Install dependencies
        run: |
          poetry config virtualenvs.in-project true --local
          poetry install --no-interaction

      - name: Lint
        run: poetry run ruff check .

      - name: Tests
        run: poetry run pytest

      - name: Migrations apply, reverse and re-apply
        run: |
          poetry run alembic upgrade head
          poetry run alembic downgrade base
          poetry run alembic upgrade head

      - name: Migrations match the models
        # Fails if someone changed a model without generating a revision.
        run: poetry run alembic check

      - name: Seed loads
        run: poetry run python -m scripts.bootstrap --reset

      - name: API answers on Postgres
        run: |
          poetry run python -m uvicorn app.main:app --port 8010 &
          for _ in $(seq 1 30); do
            curl -sf http://127.0.0.1:8010/health && break
            sleep 1
          done
          curl -sf http://127.0.0.1:8010/health
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8010/reviews)" = 200

  helios:
    name: Helios CSV export (${{ matrix.os }})
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        # Windows is a first-class target, not an afterthought: the CSV goes to a bank's
        # upload form from whatever laptop the planner has, and the encoding and
        # line-ending bugs this catches only ever appear there. Python is 3.12 on both —
        # the same version backend/ requires, so one machine setup runs the whole repo.
        os: [windows-latest, ubuntu-latest]

    defaults:
      run:
        shell: bash  # Git Bash on the Windows runner, so one script covers both

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      # No install step, deliberately: the app is standard library only, and this job
      # failing on a missing dependency is how we find out that stopped being true.
      - name: Tests
        run: python -m unittest discover -s helios/tests -t .

      - name: CLI refuses an incomplete plan
        run: |
          printf 'ref,title\n3.1,A review with nothing else filled in\n' > thin.csv
          if python -m helios thin.csv > out.csv 2> err.txt; then
            echo "::error::A row missing every required field was exported anyway." && exit 1
          fi
          cat err.txt
          grep -q "Review Lead (Staff ID) is required." err.txt
          test ! -s out.csv

      - name: CLI produces a valid file from a complete plan
        run: |
          cat > plan.csv <<'CSV'
          ref,title,team,sub-team,category,lead,business,go-live,mandated,rationale
          4.1,Incident reporting regime,Regulatory Reporting Assurance,UK (RC),Global,45012345,CIB - Global Banking,18 Mar 2027,yes,First live submissions.
          CSV
          python -m helios plan.csv -o helios.csv
          python - <<'PY'
          import csv
          from helios import spec
          raw = open("helios.csv", "rb").read()
          raw.decode("utf-8")                       # never the platform encoding
          assert b"\r\r\n" not in raw, "line endings were translated twice"
          assert raw.count(b"\r\n") == raw.count(b"\n"), "not uniformly CRLF"
          rows = list(csv.reader(open("helios.csv", newline="", encoding="utf-8")))
          assert rows[0] == spec.HEADER, "header drifted from the spec"
          assert len(rows) == 2 and len(rows[1]) == len(spec.FIELDS)
          row = dict(zip(rows[0], rows[1]))
          assert row["Plan Quarter"] == "Q1", row["Plan Quarter"]
          assert row["Business"] == "CIB — Global Banking", row["Business"]
          PY

      - name: A CSV saved by Excel on Windows still converts
        # "CSV (Comma delimited)" is cp1252, not UTF-8, and is the default in the Save As
        # dialog. Reading it as UTF-8 used to abort on the first em dash.
        run: |
          python - <<'PY'
          text = open("plan.csv", encoding="utf-8").read().replace("CIB - Global Banking", "CIB — Global Banking")
          open("excel.csv", "wb").write(text.encode("cp1252"))
          PY
          python -m helios excel.csv -o from-excel.csv
          cmp helios.csv from-excel.csv

      - name: The CSV is UTF-8 on stdout whatever the console code page is
        env:
          PYTHONIOENCODING: cp1252  # stands in for a redirected stdout on Windows
        run: |
          python -m helios plan.csv > piped.csv
          python -c "open('piped.csv','rb').read().decode('utf-8')"

      - name: Server serves the app and enforces the same rules
        run: |
          python -m helios --port 8020 --data ci-plan.json &
          for _ in $(seq 1 30); do curl -sf http://127.0.0.1:8020/ > /dev/null && break; sleep 2; done
          curl -sf http://127.0.0.1:8020/api/spec > /dev/null
          curl -sf http://127.0.0.1:8020/api/plan > /dev/null
          test "$(curl -s -o /dev/null -w '%{http_code}' -X POST http://127.0.0.1:8020/api/export \
            -H 'Content-Type: application/json' -d '{"rows":[{"title":"incomplete"}]}')" = 422

      - name: The planning workflow runs, and the methodology refuses what it should
        run: |
          op() { curl -s -o /dev/null -w '%{http_code}' -X POST \
            "http://127.0.0.1:8020/api/op/$1" -H 'Content-Type: application/json' -d "$2"; }
          test "$(op stage.critical_and_high '{"user":"CI"}')" = 200
          test "$(op quarters.waterfall '{"user":"CI"}')" = 200
          # a priority override with no rationale, and descoping a mandated review, are refused
          test "$(op priority '{"user":"CI","ref":"3.2","value":4.9}')" = 422
          test "$(op descope '{"user":"CI","ref":"4.1","rationale":"no capacity"}')" = 422
          # the Helios upload is refused while any in-plan row is incomplete
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8020/api/export/helios)" = 422
          for what in plan approvals audit; do
            curl -sf "http://127.0.0.1:8020/api/export/$what" -o "ci-$what.csv"
          done
          python - <<'PY'
          import csv, json
          plan = json.load(open("ci-plan.json", encoding="utf-8"))
          assert plan["schema"] == 1
          in_plan = [r for r in plan["reviews"] if r["staged"]]
          assert len(in_plan) == 10, len(in_plan)
          assert all(r["planned_quarter"] for r in in_plan), "waterfall left something unscheduled"
          # every refusal above must have left no audit line, and every success exactly one
          actions = [a["action"] for a in plan["audit"]]
          assert actions == ["Quarters auto-filled", "Bulk staged"], actions
          for what, header in [("plan", "Ref"), ("approvals", "Ref"), ("audit", "Timestamp")]:
              raw = open(f"ci-{what}.csv", "rb").read()
              raw.decode("utf-8")
              assert b"\r\r\n" not in raw, what
              rows = list(csv.reader(open(f"ci-{what}.csv", newline="", encoding="utf-8")))
              assert rows[0][0] == header, (what, rows[0][:1])
          PY

      - name: The plan file survives a restart
        run: |
          python - <<'PY'
          from helios.planning.store import Store
          plan = Store("ci-plan.json").load()
          assert len([r for r in plan.reviews if r.in_plan]) == 10
          assert plan.review("4.1").planned_quarter.value == "Q1"
          assert len(plan.audit) == 2
          PY

  frontend:
    name: Frontend (typecheck, tests, build)
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Tests
        run: npm test

      - name: Build
        run: npm run build

  api-contract:
    name: Generated client matches the API
    runs-on: ubuntu-latest
    needs: [backend, frontend]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install Poetry
        run: pipx install "poetry==${{ env.POETRY_VERSION }}"

      - name: Install both halves
        run: |
          cd backend && poetry config virtualenvs.in-project true --local && poetry install --no-interaction
          cd ../frontend && npm ci

      - name: Regenerate the client and diff it
        # frontend/lib/api/generated/schema.d.ts is committed so the repo builds without a
        # running backend. That only holds while it matches the API -- this proves it does.
        run: |
          cd backend
          IAP_DATABASE_URL=sqlite+pysqlite:///./ci.db poetry run python -m uvicorn app.main:app --port 8010 &
          for _ in $(seq 1 30); do
            curl -sf http://127.0.0.1:8010/health && break
            sleep 1
          done
          cd ../frontend && npm run generate:api
          git diff --exit-code -- lib/api/generated/schema.d.ts \
            || (echo "::error::The committed API client is stale. Run 'npm run generate:api' and commit the result." && exit 1)
